name: Generate Pac-Man Game

on:
  schedule: # Run automatically every 12 hours to keep it fresh
    - cron: "0 */12 * * *"
  workflow_dispatch: # Allows manual triggering
  push: # Runs on every push to the main branch
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      # Push the generated SVG to the output branch with better configuration
      - name: Push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fallback: Also commit to main branch as backup
      - name: Commit and push to main branch if needed
        run: |
          if [ -f dist/pacman-contribution-graph.svg ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            cp dist/pacman-contribution-graph.svg .
            git add pacman-contribution-graph.svg || true
            git commit -m "chore: update pac-man contribution graph" || true
            git push || true
          fi
